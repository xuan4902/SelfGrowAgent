<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SelfGrowAgent · 向上管理 · 文字冒险</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚔️</span>
      <span class="brand-name">SelfGrowAgent</span>
      <span class="brand-sub">向上管理 · 文字冒险</span>
    </div>
    <div class="topmeta">
      <div class="xpbar" title="成长值">
        <div class="xp-fill" id="xp-fill"></div>
        <span id="xp-label" class="xp-label">0 XP</span>
      </div>
      <span id="level-badge" class="badge" title="成长等级">L1</span>
      <span id="sid-badge" class="badge muted" title="会话 ID">-</span>
      <button id="btn-reset" class="ghost" title="开始一个新会话">新会话</button>
    </div>
  </header>

  <div id="journey-bar">
    <nav id="journey-dots" class="journey" aria-label="闯关进度"></nav>
  </div>

  <main id="stage">
    <div id="scene-bg"></div>

    <div class="stage-inner">
      <div id="scene-title" class="scene-title">—</div>

      <div id="hud-boss" class="hud-boss" hidden>
        <div id="boss-line" class="boss-line"></div>
        <div id="pressure-bar" class="pressure-bar"></div>
      </div>

      <div id="narration" class="narration" tabindex="0" title="点击可跳过打字"></div>

      <div id="nameplate" class="nameplate" hidden></div>
      <div id="dialogue-box" class="dialogue-box" hidden>
        <div id="dialogue-text"></div>
      </div>

      <div id="choices" class="choices"></div>
      <div id="input-area" class="input-area" hidden></div>

      <div id="status-line" class="status-line">就绪</div>
      <details id="evidence-drawer" class="evidence">
        <summary>📜 过程记录 / 评审证据</summary>
        <div id="journal" class="journal"></div>
      </details>
    </div>
  </main>

  <!-- 开始弹层 -->
  <div id="start-overlay" class="overlay">
    <div class="start-card">
      <h1>⚔️ 职场冒险 · 向上管理</h1>
      <p class="lead">一场关于「怎么跟老板相处」的文字冒险：占卜诊断 → 拜师学艺 → 副本对线 → 史官复盘。
        你的每次作答，都会生成下一道只属于你的题目与下一场只属于你的副本。</p>
      <label class="goal-label" for="goal-input">说出你的冒险诉求</label>
      <textarea id="goal-input" rows="3"
        placeholder="例如：我想提升向上管理，尤其想学会怎么跟老板汇报"></textarea>
      <div class="start-actions">
        <button id="btn-start" class="primary big">开始冒险 ▶</button>
      </div>
      <p class="note">演示数据为自建模拟数据，不收集真实个人信息；输出为辅助学习建议，最终判断以你为准。</p>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
